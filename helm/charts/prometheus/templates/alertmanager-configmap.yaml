{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'service', 'environment']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h
      receiver: 'discord'

    receivers:
      - name: 'discord'
        discord_configs:
          - webhook_url: '{{ .Values.alertmanager.discordWebhook }}'
            send_resolved: true
            title: |-
              [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .Alerts | len }})
            message: |-
              {{ range .Alerts }}
              **Alert:** {{ .Annotations.summary }}
              **Description:** {{ .Annotations.description }}
              **Severity:** {{ .Labels.severity }}
              {{ end }}
{{- end }}
