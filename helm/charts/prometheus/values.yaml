# helm/charts/prometheus/values.yaml
image:
  repository: prom/prometheus
  tag: v3.1.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090

persistence:
  size: 20Gi
  storageClassName: gp3

nodeSelector:
  node-role.kubernetes.io/monitoring: ""

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "monitoring"
    effect: "NoSchedule"

alertmanager:
  enabled: true
  discordWebhook: "https://discord.com/api/webhooks/1466280575928369162/4E0dg1WzpNrVu4RIK2WJYcSAgaXF8Y37_4jSCWp4QMDasOpfFG8sXFe7KE0NFARCGJNG"
  image:
    repository: prom/alertmanager
    tag: v0.27.0
    pullPolicy: IfNotPresent
