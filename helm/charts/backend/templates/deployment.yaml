# helm/charts/backend/templates/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  # Chart 이름을 기반으로 자동 생성 (예: backend)
  name: {{ .Chart.Name }}
  # values.yaml의 namespace 값 주입
  namespace: {{ .Values.namespace }}

spec:
  # HPA 사용 시 replicas 필드 제거 (ArgoCD 충돌 방지)
  # dev는 HPA 없으니 replicaCount 직접 사용
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      app: {{ .Chart.Name }}

  # 무중단 롤링 업데이트
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드 먼저 추가 후 구 파드 제거
      maxSurge: 1
      # 업데이트 중 항상 현재 replicas 수 유지
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}

    spec:
      # values.yaml의 nodeSelector 값 주입
      # prod-worker / dev-worker 노드로 분리 배치
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      # AZ 단위 분산 배치 (preferred)
      # required와 달리 조건 불충족 시에도 스케줄링 허용
      # HPA Scale-out 시 replicas가 AZ 수 초과해도 Pending 없음
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Chart.Name }}
              topologyKey: topology.kubernetes.io/zone
              
      # taint 허용 설정
      # 노드에 건 taint를 이 파드가 허용 (노드에서 taint 설정 추가 필요!)
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: {{ .Values.toleration }}
        effect: "NoSchedule"

      # Firebase 키 파일 Volume 정의
      volumes:
      - name: firebase-key
        secret:
          secretName: {{ .Values.secretName }}
          items:
          - key: FIREBASE_KEY_JSON
            path: firebase-key.json

      containers:
      - name: {{ .Chart.Name }}
        # values.yaml의 image 값 조합
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 8080

        # Firebase 키 파일 마운트
        # /app/firebase-key.json 경로로 파일 생성
        # FIRE_BASE_PATH=file:/app/firebase-key.json 이 경로로 읽힘
        volumeMounts:
        - name: firebase-key
          mountPath: /app/firebase-key.json
          subPath: firebase-key.json

        # ConfigMap (비민감 설정) + Secret (민감 정보) 전체 주입
        envFrom:
        - configMapRef:
            name: {{ .Values.configMapName }}
        - secretRef:
            name: {{ .Values.secretName }}

        # values.yaml의 env 값 주입
        {{- if .Values.env }}
        env:
          {{- toYaml .Values.env | nindent 8 }}
        {{- end }}

        # values.yaml의 resources 값 주입
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        # Spring Boot 기동 시간이 길어 startupProbe 별도 설정
        # startupProbe 통과 전까지 liveness/readiness 체크 유예
        # periodSeconds(5) × failureThreshold(30) = 최대 150초 대기
        startupProbe:
          httpGet:
            path: /api/actuator/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 60

        # /readiness: DB 연결, 외부 의존성 포함한 준비 상태 확인
        # 실패 시 Service 엔드포인트에서 제외 (트래픽 차단)
        readinessProbe:
          httpGet:
            path: /api/actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        # /liveness: 애플리케이션 자체 생존 여부만 확인
        # DB 장애 시 Pod 재시작해도 해결 안되므로 readiness로만 트래픽 차단
        livenessProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3