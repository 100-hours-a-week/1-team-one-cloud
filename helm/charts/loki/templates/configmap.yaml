apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      storage:
        s3:
          bucketnames: {{ .Values.storage.s3Bucket }}
          region: {{ .Values.storage.region }}
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      aws:
        s3: s3://{{ .Values.storage.region }}/{{ .Values.storage.s3Bucket }}
    ingester:
      wal:
        dir: /loki/wal
    compactor:
      working_directory: /loki/compactor
      shared_store: s3
