apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: grafana-admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: grafana-admin-password
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: sc-dashboard-volume
              mountPath: /var/lib/grafana/dashboards
        - name: grafana-sc-dashboard
          image: kiwigrid/k8s-sidecar:1.28.0
          env:
            - name: METHOD
              value: WATCH
            - name: LABEL
              value: grafana_dashboard
            - name: FOLDER
              value: /var/lib/grafana/dashboards
            - name: RESOURCE
              value: configmap
            - name: REQ_URL
              value: "http://localhost:3000/api/admin/provisioning/dashboards/reload"
            - name: REQ_METHOD
              value: "POST"
            - name: REQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: grafana-admin-user
            - name: REQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: grafana-admin-password
          volumeMounts:
            - name: sc-dashboard-volume
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: {{ .Chart.Name }}-datasources
        - name: providers
          configMap:
            name: {{ .Chart.Name }}-providers
        - name: sc-dashboard-volume
          emptyDir: {}

