{{- $root := . -}}
{{- range $path, $_ :=  .Files.Glob "dashboards/*.json" }}
{{- $filename := base $path }}
{{- $cmName := printf "%s-dashboard-%s" $root.Chart.Name (trimSuffix ".json" $filename) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ $filename }}: |-
{{ $root.Files.Get $path | indent 4 }}
{{- end }}
