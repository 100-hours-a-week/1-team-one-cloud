apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
data:
  config.alloy: |
    // 로그 수집: /var/log/containers/*.log
    local.file_match "pods" {
      path_targets = [
        { "__address__" = "localhost", "__path__" = "/var/log/containers/*.log" },
      ]
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "{{ .Values.alloy.lokiUrl }}"
        batch_wait = "1s"
        batch_size = "512KB"
      }
    }

    // --- 메트릭 수집: Kubelet + cAdvisor ---
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "node_labels" {
      targets = discovery.kubernetes.nodes.targets
      // 자기 노드만 수집
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }
    }

    prometheus.scrape "kubelet" {
      targets = discovery.relabel.node_labels.output
      scheme  = "https"
      tls_config { insecure_skip_verify = true }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // --- 메트릭 수집: 외부 DB 및 공통 서비스 (중복 수집 방지) ---
    // 특정 노드(예: 첫 번째 모니터링 노드) 하나에서만 공통 타겟을 긁도록 설정하거나,
    // 간단하게 모든 노드에서 긁되 중복되지 않도록 hash를 사용합니다.
    // 여기서는 가장 명확하게 '특정 노드에 떠 있는 Alloy'에게만 역할을 줍니다.
    
    prometheus.scrape "mysql" {
      targets = [
        { "__address__" = sys.env("DEV_DB_IP") + ":9104", "environment" = "dev", "role" = "db", "application" = "mysql", "node_filter" = "shared" },
        { "__address__" = "mysql-exporter-rds.monitoring.svc:9104", "environment" = "production", "role" = "db", "application" = "mysql", "node_filter" = "shared" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      // 공유 타겟은 모든 Alloy가 아닌 특정 노드 하나에서만 처리되도록 필터링 (Hash 사용)
      clustering {
        enabled = true
      }
    }

    prometheus.scrape "redis" {
      targets = [
        { "__address__" = sys.env("DEV_REDIS_IP") + ":9121", "environment" = "dev", "role" = "db", "application" = "redis" },
        { "__address__" = sys.env("PROD_REDIS_IP") + ":9121", "environment" = "production", "role" = "db", "application" = "redis" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      clustering {
        enabled = true
      }
    }

    // --- 메트릭 수집: 앱 파드 자동 발견 및 라벨링 ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_labels" {
      targets = discovery.kubernetes.pods.targets
      
      // 근본 해결: 자기 노드에 있는 파드만 수집 (중복 수집 방지)
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }

      // 네임스페이스를 environment 라벨로 변환
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "prod-app"
        target_label  = "environment"
        replacement   = "production"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "dev-app"
        target_label  = "environment"
        replacement   = "dev"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "application"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_role"]
        target_label  = "role"
      }
    }

    prometheus.scrape "pods" {
      targets    = discovery.relabel.pod_labels.output
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "{{ .Values.alloy.prometheusUrl }}"
      }
    }
