apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
data:
  config.alloy: |
    // --- 로그 수집 ---
    local.file_match "pods" {
      path_targets = [{ "__address__" = "localhost", "__path__" = "/var/log/containers/*.log" }]
    }
    loki.source.file "pods" {
      targets = local.file_match.pods.targets
      forward_to = [loki.write.default.receiver]
    }
    loki.write "default" {
      endpoint { url = "{{ .Values.alloy.lokiUrl }}" }
    }

    // --- 메트릭 수집: Kubelet ---
    discovery.kubernetes "nodes" { role = "node" }
    discovery.relabel "node_labels" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node_name"
      }
      rule {
        source_labels = ["node_name"]
        regex         = "^" + sys.env("NODE_NAME") + "$"
        action        = "keep"
      }
    }
    
    prometheus.scrape "kubelet" {
      targets = discovery.relabel.node_labels.output
      scheme = "https"
      tls_config { insecure_skip_verify = true }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // --- 메트릭 수집: 파드 (Annotation 필터링 적용) ---
    discovery.kubernetes "pods" { role = "pod" }
    discovery.relabel "pod_labels" {
      targets = discovery.kubernetes.pods.targets
      
      // prometheus.io/scrape=true 인 파드만 수집
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex = "true"
        action = "keep"
      }

      // prometheus.io/port 어노테이션이 있으면 타겟 포트를 그 값으로 치환
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        action = "replace"
        regex = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement = "$1:$2"
        target_label = "__address__"
      }

      // prometheus.io/path 어노테이션이 있는 경우 메트릭 경로로 치환
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        action = "replace"
        regex = "(.+)"
        target_label = "__metrics_path__"
      }

      // 담당 노드 필터링
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = "^" + sys.env("NODE_NAME") + "$"
        action        = "keep"
      }

      // 라벨링
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "prod-app"
        target_label  = "environment"
        replacement   = "production"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "dev-app"
        target_label  = "environment"
        replacement   = "dev"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "application"
      }
    }

    prometheus.scrape "pods" {
      targets = discovery.relabel.pod_labels.output
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // --- 메트릭 수집: 외부 DB (MySQL) ---
    prometheus.scrape "mysql" {
      targets = [
        { "__address__" = sys.env("DEV_DB_IP") + ":9104", "environment" = "dev", "application" = "mysql" },
        { "__address__" = "mysql-exporter-rds.monitoring.svc:9104", "environment" = "production", "application" = "mysql" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      clustering { enabled = true }
    }

    // --- 메트릭 수집: 외부 Redis ---
    prometheus.scrape "redis" {
      targets = [
        { "__address__" = sys.env("DEV_REDIS_IP") + ":9121", "environment" = "dev", "application" = "redis" },
        { "__address__" = sys.env("PROD_REDIS_IP") + ":9121", "environment" = "production", "application" = "redis" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      clustering { enabled = true }
    }

    prometheus.remote_write "default" {
      endpoint { url = "{{ .Values.alloy.prometheusUrl }}" }
    }
