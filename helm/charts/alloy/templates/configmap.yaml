apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
data:
  config.alloy: |
    // 로그 수집
    local.file_match "pods" {
      path_targets = [
        { "__address__" = "localhost", "__path__" = "/var/log/containers/*.log" },
      ]
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "{{ .Values.alloy.lokiUrl }}"
        batch_wait = "1s"
        batch_size = "512KB"
      }
    }

    // --- 메트릭 수집: Kubelet ---
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "node_labels" {
      targets = discovery.kubernetes.nodes.targets
      // 근본 해결: 정규표현식이 아닌 정확한 문자열 비교를 위해 리터럴 매칭 유도
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node_name"
      }
      rule {
        source_labels = ["node_name"]
        regex         = "^" + sys.env("NODE_NAME") + "$"
        action        = "keep"
      }
    }

    prometheus.scrape "kubelet" {
      targets = discovery.relabel.node_labels.output
      scheme  = "https"
      tls_config { insecure_skip_verify = true }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to = [prometheus.remote_write.default.receiver]
    }

    // --- 메트릭 수집: 외부 DB (Clustering 활성화로 중복 제거) ---
    prometheus.scrape "mysql" {
      targets = [
        { "__address__" = sys.env("DEV_DB_IP") + ":9104", "environment" = "dev", "role" = "db", "application" = "mysql" },
        { "__address__" = "mysql-exporter-rds.monitoring.svc:9104", "environment" = "production", "role" = "db", "application" = "mysql" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      clustering { enabled = true }
    }

    prometheus.scrape "redis" {
      targets = [
        { "__address__" = sys.env("DEV_REDIS_IP") + ":9121", "environment" = "dev", "role" = "db", "application" = "redis" },
        { "__address__" = sys.env("PROD_REDIS_IP") + ":9121", "environment" = "production", "role" = "db", "application" = "redis" },
      ]
      forward_to = [prometheus.remote_write.default.receiver]
      clustering { enabled = true }
    }

    // --- 메트릭 수집: 파드 ---
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_labels" {
      targets = discovery.kubernetes.pods.targets
      
      // 근본 해결: 자기 노드에 있는 파드만 수집 (정확한 매칭)
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "pod_node_name"
      }
      rule {
        source_labels = ["pod_node_name"]
        regex         = "^" + sys.env("NODE_NAME") + "$"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "prod-app"
        target_label  = "environment"
        replacement   = "production"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "dev-app"
        target_label  = "environment"
        replacement   = "dev"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "application"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_role"]
        target_label  = "role"
      }
    }

    prometheus.scrape "pods" {
      targets    = discovery.relabel.pod_labels.output
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "{{ .Values.alloy.prometheusUrl }}"
      }
    }
