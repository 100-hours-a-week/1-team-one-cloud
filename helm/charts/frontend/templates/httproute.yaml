{{- if .Values.ingress.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: {{ .Values.ingress.gatewayName }}
    namespace: gateway-system
  rules:
  {{- range .Values.ingress.rules }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    backendRefs:
    - name: {{ $.Chart.Name }}-svc
      port: 80
  {{- end }}
{{- end }}
