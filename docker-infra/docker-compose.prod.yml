services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - ai
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE_URI:-frontend:latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE_URI:-backend:latest}
    container_name: backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - OTEL_JAVAAGENT_ENABLED=false
    volumes:
      - /etc/secrets:/etc/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ai:
    image: ${AI_IMAGE_URI:-ai:latest}
    container_name: ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          " -h",
          "localhost",
          "-u",
          "root",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    command:
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # 1. 클러스터 식별자 (공식 이미지 KRaft 모드)
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      # 2. KRaft 역할 지정 (Broker + Controller 통합)
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # 3. 리스너(네트워크) 설정 (프로덕션 도커 브리지 네트워크 통신에 맞춰 최적화)
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 4. 단일 노드를 위한 필수 복제 팩터 설정
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # 5. JVM 힙 메모리 256MB 최적화 축소
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms256m
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  app_network:
    driver: bridge
    name: prod_network

volumes:
  mysql_data:
    driver: local
    name: prod_mysql_data
  redis_data:
    driver: local
    name: prod_redis_data
  kafka_data:
    driver: local
    name: prod_kafka_data
  qdrant_data:
    driver: local
    name: prod_qdrant_data
