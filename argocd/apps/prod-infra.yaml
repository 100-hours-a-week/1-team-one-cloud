# argocd/apps/prod-ccm.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-ccm
  namespace: argocd
spec:
  project: prod-project
  source:
    repoURL: https://kubernetes.github.io/cloud-provider-aws
    chart: aws-cloud-controller-manager
    targetRevision: 0.0.8
    helm:
      values: |
        args:
          - --v=2
          - --cloud-provider=aws
          - --configure-cloud-routes=false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# argocd/apps/prod-envoy-gateway.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-envoy-gateway
  namespace: argocd
spec:
  project: prod-project
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
---
# argocd/apps/prod-gateway-config.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gateway-config
  namespace: argocd
spec:
  project: prod-project
  source:
    repoURL: https://github.com/100-hours-a-week/1-team-one-cloud.git
    targetRevision: HEAD
    path: k8s-infra/gateway/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
