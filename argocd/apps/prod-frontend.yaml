# argocd/apps/prod-frontend.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: prod-project

  source:
    repoURL: https://github.com/100-hours-a-week/1-team-one-cloud.git
    targetRevision: HEAD
    path: helm/charts/frontend
    helm:
      valueFiles:
        - ../../../helm/envs/prod/frontend-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true