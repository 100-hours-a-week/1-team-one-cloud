apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: monitoring-secret
  namespace: monitoring
spec:
  encryptedData:
    # Grafana
    grafana-admin-user: 
    grafana-admin-password: 
    # External IPs
    DEV_DB_IP: 
    DEV_REDIS_IP: 
    PROD_REDIS_IP: 
    # RDS Connection (MySQL Exporter용)
    RDS_HOSTNAME: 
    RDS_USERNAME: 
    RDS_PASSWORD: 
  template:
    metadata:
      name: monitoring-secret
      namespace: monitoring
    type: Opaque
